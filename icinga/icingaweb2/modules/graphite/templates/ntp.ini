; Graph templates for check_ntpd (icinga/plugins/check_ntpd). Each mode sends only its own
; perfdata, so a service shows only the template whose metrics it has.
; Installed in /etc/icingaweb2/modules/graphite/templates/ntp.ini
; Icinga normalizes "ms" to seconds; scale() turns it back into ms.

[ntpd-offset.graph]
check_command = "ntpd"

[ntpd-offset.metrics_filters]
value = "$service_name_template$.perfdata.offset.value"
warn = "$service_name_template$.perfdata.offset.warn"

[ntpd-offset.urlparams]
areaAlpha = "0.3"
areaMode = "first"
lineWidth = "2"
title = "Offset"
yUnitSystem = "none"

[ntpd-offset.functions]
value = "alias(color(scale($metric$, 1000), '#1a7dd7'), 'Offset (ms)')"
warn = "alias(color(scale($metric$, 1000), '#ff8d00'), 'Warn (ms)')"


[ntpd-jitter.graph]
check_command = "ntpd"

[ntpd-jitter.metrics_filters]
sys.value = "$service_name_template$.perfdata.sys_jitter.value"
clk.value = "$service_name_template$.perfdata.clk_jitter.value"

[ntpd-jitter.urlparams]
lineWidth = "2"
min = "0"
title = "Jitter"
yUnitSystem = "none"

[ntpd-jitter.functions]
sys.value = "alias(color(scale($metric$, 1000), '#1a7dd7'), 'System jitter (ms)')"
clk.value = "alias(color(scale($metric$, 1000), '#a14df0'), 'Clock jitter (ms)')"


[ntpd-drift.graph]
check_command = "ntpd"

[ntpd-drift.metrics_filters]
freq.value = "$service_name_template$.perfdata.frequency.value"
wander.value = "$service_name_template$.perfdata.clk_wander.value"

[ntpd-drift.urlparams]
lineWidth = "2"
title = "Drift"
yUnitSystem = "none"

[ntpd-drift.functions]
freq.value = "alias(color($metric$, '#1a7dd7'), 'Frequency (ppm)')"
wander.value = "alias(color($metric$, '#44bb77'), 'Wander (ppm)')"


[ntpd-peers.graph]
check_command = "ntpd"

[ntpd-peers.metrics_filters]
peers.value = "$service_name_template$.perfdata.peers.value"
cand.value = "$service_name_template$.perfdata.candidates.value"

[ntpd-peers.urlparams]
lineWidth = "2"
min = "0"
title = "Peers"
yUnitSystem = "none"

[ntpd-peers.functions]
peers.value = "alias(color($metric$, '#cfd7e6'), 'Peers')"
cand.value = "alias(color($metric$, '#44bb77'), 'Usable')"
