; Graph templates for the custom check commands (plugins in srv-nas-pi/icinga/plugins).
; Installed in /etc/icingaweb2/modules/graphite/templates/custom.ini

[zpool.graph]
check_command = "zpool"

[zpool.metrics_filters]
value = "$service_name_template$.perfdata.$pool$_cap.value"
warn = "$service_name_template$.perfdata.$pool$_cap.warn"
crit = "$service_name_template$.perfdata.$pool$_cap.crit"

[zpool.urlparams]
areaAlpha = "0.5"
areaMode = "first"
lineWidth = "2"
min = "0"
max = "100"
title = "Pool $pool$ capacity"
yUnitSystem = "none"

[zpool.functions]
value = "alias(color($metric$, '#1a7dd7'), 'Used (%)')"
warn = "alias(color($metric$, '#ff8d00'), 'Warn (%)')"
crit = "alias(color($metric$, '#ff0000'), 'Crit (%)')"


[smart-temp.graph]
check_command = "smart_disk"

[smart-temp.metrics_filters]
value = "$service_name_template$.perfdata.temp.value"
warn = "$service_name_template$.perfdata.temp.warn"
crit = "$service_name_template$.perfdata.temp.crit"

[smart-temp.urlparams]
areaAlpha = "0.3"
areaMode = "first"
lineWidth = "2"
min = "20"
title = "Disk temperature"
yUnitSystem = "none"

[smart-temp.functions]
value = "alias(color($metric$, '#1a7dd7'), 'Temperature (C)')"
warn = "alias(color($metric$, '#ff8d00'), 'Warn (C)')"
crit = "alias(color($metric$, '#ff0000'), 'Crit (C)')"


[smart-realloc.graph]
check_command = "smart_disk"

[smart-realloc.metrics_filters]
value = "$service_name_template$.perfdata.reallocated.value"

[smart-realloc.urlparams]
lineWidth = "2"
min = "0"
title = "Reallocated sectors"
yUnitSystem = "none"

[smart-realloc.functions]
value = "alias(color($metric$, '#a14df0'), 'Reallocated sectors')"


[pi-temp.graph]
check_command = "pi_health"

[pi-temp.metrics_filters]
value = "$service_name_template$.perfdata.soc_temp.value"
warn = "$service_name_template$.perfdata.soc_temp.warn"
crit = "$service_name_template$.perfdata.soc_temp.crit"

[pi-temp.urlparams]
areaAlpha = "0.3"
areaMode = "first"
lineWidth = "2"
min = "30"
title = "SoC temperature"
yUnitSystem = "none"

[pi-temp.functions]
value = "alias(color($metric$, '#1a7dd7'), 'SoC (C)')"
warn = "alias(color($metric$, '#ff8d00'), 'Warn (C)')"
crit = "alias(color($metric$, '#ff0000'), 'Crit (C)')"


[memavail.graph]
check_command = "memavail"

[memavail.metrics_filters]
avail.value = "$service_name_template$.perfdata.avail.value"
avail.max = "$service_name_template$.perfdata.avail.max"
arc.value = "$service_name_template$.perfdata.arc.value"

[memavail.urlparams]
areaAlpha = "0.4"
lineWidth = "2"
min = "0"
title = "Memory"
yUnitSystem = "binary"

[memavail.functions]
avail.max = "alias(color($metric$, '#cfd7e6'), 'Total')"
avail.value = "alias(color($metric$, '#44bb77'), 'Available')"
arc.value = "alias(color($metric$, '#ffaa44'), 'ZFS ARC')"
