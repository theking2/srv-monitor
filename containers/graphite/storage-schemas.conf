# /srv/graphite/conf/storage-schemas.conf
# Retention for Icinga 2 metrics (icinga2.<host>.services.<service>.<command>.perfdata.<label>.<value|warn|crit|min|max>).
# The base resolution matches the check interval: a 1 min archive for a 5 min check leaves gaps that
# graphite-web draws as nothing. Rules are matched top down; first match wins.
# Changing a rule affects new metrics only; existing .wsp files need whisper-resize.py.

[carbon]
pattern = ^carbon\.
retentions = 1m:30d

# SMART checks run every 30 min
[icinga2_smart]
pattern = ^icinga2\..*\.services\.smart_
retentions = 30m:2y,2h:5y

# apt runs hourly
[icinga2_apt]
pattern = ^icinga2\..*\.services\.apt\.
retentions = 1h:5y

# certificate checks run every 6 h
[icinga2_cert]
pattern = ^icinga2\..*\.services\.cert_
retentions = 6h:5y

# everything else: checks every 1-5 min
[icinga2_default]
pattern = ^icinga2\.
retentions = 5m:90d,30m:1y,2h:5y

[default]
pattern = .*
retentions = 5m:30d
