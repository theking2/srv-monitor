# /etc/apache2/conf-available/icingaweb2-root-redirect.conf
# Send the bare "/" to Icinga Web 2, for http://srv-monitor/ and for monitor.kingma.ch through NPM.
# Only "/" itself matches; every other path is served as before.
# Apache sends the target as an absolute URL with the scheme it sees (http://<Host>/icingaweb2/);
# mod_headers cannot rewrite that Location. Behind an HTTPS front end, let NPM force HTTPS.
RedirectMatch 302 ^/$ /icingaweb2/
